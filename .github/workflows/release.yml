name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds and uploads the files as a workflow artifact without
  # creating a release, to test this workflow before tagging.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and checksum
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # release binaries are built without cached artifacts
      - name: Install the Wails CLI at the version go.mod requires
        shell: pwsh
        run: |
          $version = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          go install "github.com/wailsapp/wails/v2/cmd/wails@$version"
      - name: scripts/check.ps1
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Package (a tag must match the code version)
        shell: pwsh
        env:
          # An environment variable, not ${{ }} inside the script, so a
          # crafted tag name cannot inject commands.
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/package-release.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  draft:
    name: Create a draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      # A draft is visible only to repository maintainers; publishing it is
      # a manual step.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" dist/HashHarvest.exe dist/hashharvest-cli.exe dist/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "HashHarvest $TAG"
